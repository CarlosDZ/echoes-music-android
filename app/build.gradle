plugins {
    id 'com.android.application'
}

// Release signing config is read from keystore.properties (gitignored) if present.
// Without it, debug builds still work; release builds come out unsigned.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.musica.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.musica.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.1_0"

        // youtubedl-android ships native Python + ffmpeg per-ABI. Limiting the
        // ABIs keeps the APK sane (each ABI adds ~tens of MB). arm64-v8a covers
        // modern phones (the Xiaomi test device); armeabi-v7a covers older ones.
        // Add 'x86_64' here if you ever run it on an emulator.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                // Resolve relative to app-android/ (where keystore.properties lives),
                // not the app/ module dir.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    // youtubedl-android extracts its bundled Python at runtime, so the native
    // libs must be stored uncompressed and page-alignable in the APK (the old
    // extractNativeLibs="true" behaviour). Required or init() crashes.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// Output APK name: "Echoes Music-<version>-<variant>.apk".
base {
    archivesName = "Echoes Music-${android.defaultConfig.versionName}"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'com.google.android.material:material:1.12.0'

    // Audio playback: plays local file:// and remote http:// (Range/seek) alike.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    // MediaSession + standard media notification + background playback.
    implementation 'androidx.media3:media3-session:1.4.1'

    // On-device YouTube search + download (bundles yt-dlp + Python). The yt-dlp
    // engine self-updates at runtime, so YouTube breakages are fixed without a
    // new app release. ffmpeg artifact is needed for audio extraction to MP3.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
